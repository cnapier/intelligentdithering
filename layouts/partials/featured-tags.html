<section>
  {{ $bottom := .Scratch.Get "bottom" }}
  {{ if $bottom }}
  <hr class="hidden-sm hidden-xs">
  {{ end }}
  {{- /* Site override: h2 instead of h5 so headings don't skip levels (styled the same) */}}
  <h2 class="sidebar-title">FEATURED TAGS</h2>
  <div class="tags">
    {{ range .Site.Taxonomies.tags }}
    <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
    {{ end }}
  </div>
</section>
