baseURL = "https://intelligentdithering.com/"
title = "Intelligent Dithering"

theme = "puppet"
themesDir = "themes/"

copyright = "Intelligent Dithering 2026"
paginate = 3
locale = "en-GB"
defaultContentLanguage = "en"

hasCJKLanguage = true
enableInlineShortcodes = true
enableEmoji = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]

[services]
[services.disqus]
shortname = "intelligentdithering"
[services.rss]
# Keep the feed short: older posts were never in the WordPress feed and
# would appear as unread to existing subscribers if included.
limit = 5
[outputs]
home = ["HTML", "JSON", "RSS", "htaccess"]

# .htaccess is generated from layouts/index.htaccess so every WordPress alias gets a real 301
[mediaTypes."text/htaccess"]
suffixes = ["htaccess"]
[outputFormats.htaccess]
mediaType = "text/htaccess"
baseName = ""
isPlainText = true
notAlternative = true

# prevent build failures when using Hugo's template _internal/opengraph.html 
[taxonomies]
category = "categories"
tag = "tags"

[markup]
[markup.highlight]
noClasses = true
codeFences = true
guessSyntax = true
lineNos = true
lineNumbersInTable = false
style = "dracula"

[markup.goldmark.renderer]
unsafe = true

[menu]
[[menu.main]]
identifier = "home"
name = "Home"
url = "/"
weight = -100
[[menu.main]]
identifier = "archive"
name = "Archive"
url = "/archive/"
weight = 10
[[menu.main]]
identifier = "things"
name = "Things I Use"
url = "/things-i-use/"
weight = 50


[params]
author = "Colin"
description = "Overthinking technology so you don't have to"
# Used for the home page / fallback meta description (the tagline alone is too short for search results)
seo_description = "Open source, automation and digital independence – practical guides on Raspberry Pi, Mac and iOS apps, home automation and school IT from a working sysadmin."
# Default share image for pages with no image of their own (1200x630)
og_image = "img/og-default.png"
og_locale = "en_GB"
html_lang = "en-GB"
img_home = "img/home-bg-dither.png"
img_404 = "img/404-bg.jpg"

useFaviconGenerator = true

custom_js = []
custom_css = ["css/custom.scss"] #  Add your file to assets folder  [assets/css/custom.css]

# Cookieless analytics - https://intelligentdithering.goatcounter.com
[params.goatcounter]
code = "intelligentdithering"

[params.sidebar]
enable = true
gravatarEmail = "colin@intelligentdithering.com"
# Overwritten by your gravatar image if `gravatarEmail` is filled
avatar = "img/home-bg.jpg"
bio = "nerding out"

[params.social]
facebook = "intelligentdithering"
rss = true

[params.social.mastodon]
weight = 56
icon = "fab fa-mastodon"
format = "https://mastodon.social/%v"
id = "@intelligentdithering"
url = ""


#[[params.friends]]
#name = "John Doe"
#url = "https://gohugo.io"

# See https://giscus.app/
[params.giscus]
enable = false
repo = "roninro/hugo-theme-puppet"
repo_id = "R_kgDOHuvyhw"
category = "General"
category_id = "DIC_kwDOHuvyh84CQjDo"
input_position = "top"
theme = "light_tritanopia"
lang = "en"
